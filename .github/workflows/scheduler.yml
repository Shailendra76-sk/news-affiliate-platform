name: News Automation Scheduler

on:
  schedule:
    # Every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Manual trigger from GitHub

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          cd backend
          cat > .env << EOF
          GROQ_API_KEY_1=${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2=${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3=${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4=${{ secrets.GROQ_API_KEY_4 }}
          GEMINI_API_KEY_1=${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2=${{ secrets.GEMINI_API_KEY_2 }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY }}
          TOGETHER_API_KEY=${{ secrets.TOGETHER_API_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          HUGGINGFACE_API_KEY=${{ secrets.HUGGINGFACE_API_KEY }}
          AMAZON_ACCESS_KEY=${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY=${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_ASSOCIATE_TAG=${{ secrets.AMAZON_ASSOCIATE_TAG }}
          AMAZON_COUNTRY=IN
          FACEBOOK_ACCESS_TOKEN=${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
          UNSPLASH_ACCESS_KEY=${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          APP_URL=${{ secrets.APP_URL }}
          DATABASE_URL=sqlite:///./news_platform.db
          ARTICLES_PER_CYCLE=5
          NEWS_FETCH_INTERVAL=2
          DEBUG=False
          EOF

      - name: Run automation cycle
        run: |
          cd backend
          python -c "
          import asyncio
          from scheduler import run_full_cycle
          asyncio.run(run_full_cycle())
          "

      - name: Upload database artifact
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: database-backup
          path: backend/news_platform.db
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "Automation cycle failed!"
          echo "Check logs above for details"
